os:
  # Open files through herdr-run so they land in the right nvim/pane/tab instead of inside
  # lazygit's popup. Lazygit runs in the repo root, which herdr-run uses to resolve the
  # relative filename.
  # herdr-run returns at once: run it in the background instead of suspending lazygit, which
  # flashes the command on screen.
  editInTerminal: false
  # In herdr's lazygit popup ($LAZYGIT_POPUP, set in herdr's config.toml) quit lazygit afterwards:
  # a popup only closes when its process exits. $PPID is lazygit, the parent of this shell.
  edit: 'herdr-run --edit {{filename}} && { [ -z "$LAZYGIT_POPUP" ] || kill $PPID; }'
  editAtLine: 'herdr-run --edit {{filename}} --line {{line}} && { [ -z "$LAZYGIT_POPUP" ] || kill $PPID; }'
# herdr-run returns right away; don't wait for enter after the editor command
promptToReturnFromSubprocess: false
git:
  diffRenderers:
    # word-level diff highlighting (requires `git-delta`)
    - command: delta --dark --paging=never --line-numbers --hunk-header-style=omit
gui:
  # same colors as lazygit inside neovim: snacks.nvim generates them from the neovim theme (tokyonight)
  # into ~/.cache/nvim/lazygit-theme.yml, copied here so lazygit outside neovim matches
  theme:
    activeBorderColor:
      - "#ff966c"
      - bold
    inactiveBorderColor:
      - "#04d1f9"
    searchingActiveBorderColor:
      - "#ff966c"
      - bold
    optionsTextColor:
      - "#82aaff"
    selectedLineBgColor:
      - "#2d3f76"
    cherryPickedCommitFgColor:
      - "#82aaff"
    cherryPickedCommitBgColor:
      - "#c099ff"
    unstagedChangesColor:
      - "#c53b53"
    defaultFgColor:
      - "#c8d3f5"
  nerdFontsVersion: "3"
