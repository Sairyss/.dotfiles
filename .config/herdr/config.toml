onboarding = false

[theme]
name = "tokyo-night"

[ui.toast]
delivery = "herdr"

[ui]
# new tabs get named by herdr-auto-title instead of prompting (a typed name counts as manual)
prompt_new_tab_name = false
pane_borders = "off"
pane_outer_borders = false
pane_gaps = false

# agents panel: one line per agent (name · machine · workspace dir); nvim instances
# (registered by local-plugins/agent-sort from the nvim terminal title) get a bold purple name, claude is orange, others light
[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    { token = "agent", fg = "#c0caf5", rules = [
      { equals = "nvim", fg = "#bb9af7", bold = true },
      { starts_with = "claude", fg = "#ff9e64" },
    ] },
    "workspace",
    "machine",
  ],
]

# workspaces panel: "<workspace> › <app>" (the title token is set by local-plugins/agent-sort)
[ui.sidebar.spaces]
rows = [["state_icon", { token = "$title", fg = "#c0caf5" }, "git_status"], []]

[theme.custom]
# overlay0 = "#181926"
# accent = "#2fc77f"

[keys]
prefix = "ctrl+g"
copy_mode = "prefix+y"
previous_workspace = "alt+k"
next_workspace = "alt+j"
split_vertical = "prefix+|"
settings = "prefix+shift+s"
open_notification_target = "prefix+o" # jump to the agent that finished / needs attention
next_agent = "alt+u"
previous_agent = "alt+i"

[keys.indexed]
tabs = "ctrl" # ctrl+1..9 jump to the n-th tab

# which-key leader, tree in which-key/keys.toml
[[keys.command]]
key = "ctrl+b"
type = "plugin_action"
command = "pradyb.which-key.open"
description = "which-key"

# herdr nvim
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# vim-herdr-navigation (local, alt-based)
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# annotate capture also directly on prefix+a (works from copy mode); full set via which-key
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

# sesh
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "sesh workspace picker"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "sesh: previous workspace"

# Apps: herdr-run [--tab|--split] <cmd> (modes and popup example: see local-plugins/launch/bin/herdr-run).
# Key bindings don't have your shell's PATH, so the plugin's bin/ is spelled out.
[[keys.command]] # split pane
key = "prefix+F"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run --split yazi"
description = "yazi in a split"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run yazi"
description = "yazi"

[[keys.command]]
key = "prefix+n"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run nvim ."
description = "neovim"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run lazygit"
description = "lazygit"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run claude --dangerously-skip-permissions"
description = "claude (skip permissions)"

[[keys.command]] # popup in the middle of the screen
key = "prefix+t"
type = "popup"
command = "tv channels"
width = "80%"
height = "80%"
description = "television"
