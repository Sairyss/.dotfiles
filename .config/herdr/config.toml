onboarding = false

[theme]
name = "tokyo-night"

[ui.toast]
delivery = "herdr"

[ui]
# new tabs get named by herdr-auto-title instead of prompting (a typed name counts as manual)
prompt_new_tab_name = false
pane_borders = "off"
pane_outer_borders = false
pane_gaps = false

# agents panel: one line per agent (name · machine · workspace dir); nvim instances
# (registered by local-plugins/agent-sort from the nvim terminal title) get a bold purple name, claude is orange, others light
[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    { token = "agent", fg = "#c0caf5", rules = [
      { equals = "nvim", fg = "#bb9af7", bold = true },
      { starts_with = "claude", fg = "#ff9e64" },
    ] },
    "workspace",
    "machine",
  ],
]

# workspaces panel, two rows: "<workspace> · <app>" and tab count, then the running command's arguments, branch, uncommitted file count and git status
# (the $app, $cmd, $branch, $dirty and $tabs tokens are set by local-plugins/agent-sort; the $title token it also sets holds the old single-token "<workspace>·<app>" form)
[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    { token = "workspace", fg = "#c0caf5" },
    { token = "$app", fg = "#7dcfff", rules = [
      { equals = "nvim", fg = "#bb9af7", bold = true },
      { starts_with = "claude", fg = "#ff9e64" },
    ] },
    { token = "$tabs", fg = "#9aa5ce", dim = false },
  ],
  [
    { token = "$cmd", fg = "#9ece6a" },
    { token = "$branch" },
    { token = "$dirty", fg = "#e0af68" },
    "git_status",
  ],
]

[theme.custom]
# overlay0 = "#181926"
# accent = "#2fc77f"

[keys]
prefix = "ctrl+g"
copy_mode = "prefix+y"
previous_workspace = "alt+k"
next_workspace = "alt+j"
split_vertical = "prefix+|"
settings = "prefix+shift+s"
open_notification_target = "prefix+o" # jump to the agent that finished / needs attention
next_agent = "alt+u"
previous_agent = "alt+i"

[keys.indexed]
tabs = "ctrl" # ctrl+1..9 jump to the n-th tab

# which-key leader, tree in which-key/keys.toml
[[keys.command]]
key = "ctrl+b"
type = "plugin_action"
command = "pradyb.which-key.open"
description = "which-key"

# herdr nvim
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# vim-herdr-navigation (local, alt-based)
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# annotate capture also directly on prefix+a (works from copy mode); full set via which-key
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "sesh: previous workspace"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run --reuse yazi"
description = "yazi"

[[keys.command]]
key = "prefix+n"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run --reuse nvim ."
description = "neovim"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run claude --dangerously-skip-permissions"
description = "claude (skip permissions)"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-run --reuse btop"
description = "btop"

# like prefix+o (open_notification_target), but not limited to the time the toast is visible: focuses the
# job/agent that has been done or failed the longest (see herdr-jump-done)
[[keys.command]]
key = "prefix+O"
type = "shell"
command = "$HOME/.config/herdr/local-plugins/launch/bin/herdr-jump-done"
description = "jump to the oldest finished/failed job"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "tv channels"
width = "80%"
height = "80%"
description = "television"

# [[keys.command]]
# key = "prefix+s"
# type = "plugin_action"
# command = "fullerzz.sesh.open-picker"
# description = "sesh workspace picker"

[[keys.command]]
key = "prefix+s"
type = "popup"
command = "tv herdr-zoxide"
width = "80%"
height = "80%"
description = "television"

[[keys.command]]
key = "prefix+l"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "lazygit (popup)"
