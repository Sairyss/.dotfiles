onboarding = false

[theme]
name = "tokyo-night"

[ui.toast]
delivery = "herdr"

[ui]
# new tabs get named by herdr-auto-title instead of prompting (a typed name counts as manual)
prompt_new_tab_name = false
pane_borders = "off"
pane_outer_borders = false
pane_gaps = false

# agents panel: one line per agent (name · machine · workspace dir); nvim instances
# (registered by local-plugins/agent-sort from the nvim terminal title) get a bold purple name, claude is orange, others light
[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    { token = "agent", fg = "#c0caf5", rules = [
      { equals = "nvim", fg = "#bb9af7", bold = true },
      { starts_with = "claude", fg = "#ff9e64" },
    ] },
    "workspace",
    "machine",
  ],
]

# workspaces panel: "<workspace> › <app>" (the title token is set by local-plugins/agent-sort)
[ui.sidebar.spaces]
rows = [["state_icon", { token = "$title", fg = "#c0caf5" }, "git_status"], []]

[theme.custom]
# overlay0 = "#181926"
# accent = "#2fc77f"

[keys]
prefix = "ctrl+g"
copy_mode = "prefix+y"
previous_workspace = "alt+k"
next_workspace = "alt+j"
split_vertical = "prefix+|"
settings = "prefix+shift+s"
open_notification_target = "prefix+o" # jump to the agent that finished / needs attention
next_agent = "alt+u"
previous_agent = "alt+i"

# which-key leader, tree in which-key/keys.toml
[[keys.command]]
key = "ctrl+b"
type = "plugin_action"
command = "pradyb.which-key.open"
description = "which-key"

# herdr nvim
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# vim-herdr-navigation (local, alt-based)
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# annotate capture also directly on prefix+a (works from copy mode); full set via which-key
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

# sesh
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "sesh workspace picker"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "sesh: previous workspace"

# Apps
[[keys.command]] # open in a split pane
key = "prefix+F"
type = "plugin_action"
command = "app-launcher.open"
description = "open file explorer"

[[keys.command]] # open in a new tab
key = "prefix+f"
type = "plugin_action"
command = "app-launcher.open-tab"
description = "open file explorer in a new tab"

[[keys.command]] # neovim here if the shell is idle, else in a new tab
key = "prefix+n"
type = "plugin_action"
command = "app-launcher.open-nvim"
description = "open neovim"

[[keys.command]] # lazygit here if the shell is idle, else in a new tab
key = "prefix+l"
type = "plugin_action"
command = "app-launcher.open-lazygit"
description = "open lazygit"

# Tabs
[[keys.command]]
key = "ctrl+1"
type = "plugin_action"
command = "tab-jump.tab-1"
description = "go to tab 1"

[[keys.command]]
key = "ctrl+2"
type = "plugin_action"
command = "tab-jump.tab-2"
description = "go to tab 2"

[[keys.command]]
key = "ctrl+3"
type = "plugin_action"
command = "tab-jump.tab-3"
description = "go to tab 3"

[[keys.command]]
key = "ctrl+4"
type = "plugin_action"
command = "tab-jump.tab-4"
description = "go to tab 4"

[[keys.command]]
key = "ctrl+5"
type = "plugin_action"
command = "tab-jump.tab-5"
description = "go to tab 5"
