# Host-only packages and services; not for containers/VMs.
#
# Dry run: `mise -E host bootstrap --dry-run`
# Apply:   `mise -E host bootstrap --update`

[bootstrap.packages]
# SSH server: Arch's openssh package already includes it
"dnf:openssh-server" = "latest"
"apt:openssh-server" = "latest"

kitty = { os = "linux" }
"brew-cask:kitty" = { os = "macos" }

# Utilities
wl-clipboard = { os = "linux" }
opensnitch = { os = "linux" }

# Containers/VMs
incus = { os = "linux" }

# Remote access
tailscale = "latest"
netbird = { os = "linux" }

[bootstrap.services.netbird]
state = "running"
enabled = true

[bootstrap.services.sshd]
state = "running"
enabled = true
