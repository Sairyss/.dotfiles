# Optional packages, installed on a host or in a container/VM (e.g. toolbx).
#
# Each tool is declared once, by its bare name. The package manager is picked
# by `system_packages.prefer`, which install-mise.sh sets from what is
# installed (nix, then brew, then the distro's manager; container: distro only).
# Use `names = { manager = "pkg" }` only where a package is named differently.
# Packages that must always be native are in config.core.toml.
#
# Dry run: `mise -E base bootstrap --dry-run`
# Apply:   `mise -E base bootstrap --update`

[bootstrap.packages]
# Editor
neovim = "latest"

# Git
lazygit = "latest"
git-delta = "latest"

# Search and navigation
ripgrep = "latest"
fd = { names = { dnf = "fd-find", apt = "fd-find" } }

# Build dependencies
cmake = "latest"

# Terminal shell
starship = "latest"
zoxide = "latest"
atuin = "latest"
bat = "latest"
eza = "latest"

# Utilities
jq = "latest"
btop = "latest"
television = "latest"
yazi = "latest"
stow = "latest"
unzip = "latest"

"aur:herdr" = { os = "linux" }
"brew:herdr" = { os = "macos" }
