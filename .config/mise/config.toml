# Shared by every environment (host and container/VM); always loaded.
#
# Dry run: `mise bootstrap --dry-run`
# Apply:   `mise bootstrap --update`

[settings]
system_packages.prefer = ["dnf", "pacman", "apt", "brew"]
system_packages.ostree = "layer"

# zsh as the login shell on every machine; the package has to come with it.
[bootstrap.user]
login_shell = "zsh"

[bootstrap.packages]
# Shell
zsh = "latest"

# Editor: package source is picked by the `brew` or `native` env
neovim = { env = "native" }
"brew:neovim" = { env = "brew" }

openssh = { names = { pacman = "openssh", dnf = "openssh-clients", apt = "openssh-client" }, os = "linux" }

unzip = { env = "native" }
"brew:unzip" = { env = "brew" }
