# Shared by every environment (host and container/VM); always loaded.
#
# Dry run: `mise bootstrap --dry-run`
# Apply:   `mise bootstrap --update`

[settings]
# Default order, used by the core env and the host env. install-mise.sh
# overrides it for the base env (MISE_SYSTEM_PACKAGES_PREFER).
system_packages.prefer = ["nix", "brew", "dnf", "pacman", "apt"]
system_packages.ostree = "layer"

# zsh as the login shell on every machine; the package is in config.core.toml.
[bootstrap.user]
login_shell = "zsh"
