[metadata]
name = "dotenv"
description = "Search environment variables in .env* files of the current directory or the top zoxide directories"
requirements = ["rg", "bat", "wl-copy", "zoxide"]

[source]
# Output format: file:line:KEY=VALUE
# The current directory (or git root) if it has .env* files, else the top zoxide directories that do.
# Nothing found: a single placeholder entry (file ".") explaining why the list is empty
command = "${TELEVISION_CONFIG:-${XDG_CONFIG_HOME:-$HOME/.config}/television}/scripts/dotenv-vars"
display = "{split:\\::2} [{split:\\::0}]"
output = "{split:=:1..}"

[preview]
# Show the file with the target line highlighted
command = "bat --style=numbers --color=always '{split:\\::0}' 2>/dev/null || echo 'Nothing to preview. Run this from a directory containing .env files.'"
offset = "{split:\\::1}"
env = { BAT_THEME = "Catppuccin Mocha" }

[ui]
layout = "portrait"

[ui.preview_panel]
size = 40
header = "{split:\\::0}:{split:\\::1}"

[keybindings]
shortcut = "f3"
enter = "actions:copy"

[actions.copy]
description = "Copy the selected variable's value to the clipboard"
# Read the value from the file (safe for any quoting), strip one pair of surrounding quotes.
# Placeholder entry (not a file) copies nothing.
command = "[ -f '{split:\\::0}' ] && sed -n '{split:\\::1}p' '{split:\\::0}' | sed -E 's/^[^=]*=//; s/^\"(.*)\"$/\\1/; s/^'\"'\"'(.*)'\"'\"'$/\\1/' | tr -d '\\n' | wl-copy"
mode = "execute"
