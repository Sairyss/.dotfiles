[metadata]
name = "channels"
description = "Select a television channel"
requirements = ["tv", "bat"]

[source]
command = ["tv list-channels"]

[preview]
# our own channels are in cable/custom and win over a default of the same name
command = '''d="${TELEVISION_CONFIG:-${XDG_CONFIG_HOME:-$HOME/.config}/television}/cable"; f="$d/custom/{}.toml"; [ -f "$f" ] || f="$d/{}.toml"; bat -pn --color always "$f"'''
shell = "bash"

[keybindings]
enter = "actions:channel-enter"

[actions.channel-enter]
description = "Enter a television channel"
command = "tv {}"
mode = "execute"
