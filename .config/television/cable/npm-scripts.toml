[metadata]
name = "npm-scripts"
description = "List and run npm scripts from package.json"
requirements = ["jq"]

[source]
command = "jq -r '.scripts | to_entries[] | \"\\(.key)\\t\\(.value)\"' package.json 2>/dev/null"
display = "{split:\\t:0}"

[preview]
command = "jq -r '.scripts[\"{split:\\t:0}\"]' package.json"

[ui.preview_panel]
size = 30

[keybindings]
enter = "actions:run-job"

[actions.run]
description = "Run the selected npm script; `test` asks for extra arguments first"
command = "herdr-run --here --ask-if \"run 'test'$\" \"npm run '{split:\\t:0}'\""
mode = "execute"

[actions.run-job]
description = "Run the selected npm script in a new herdr tab; the tab closes 1 minute after it exits (a long-running script stays, marked done, until you focus it); a failure shows as blocked in the sidebar; `test` asks for extra arguments first"
command = "herdr-run --job --ask-if \"run 'test'$\" \"npm run '{split:\\t:0}'\""
mode = "execute"

[actions.run-job-args]
description = "Run the selected npm script in a new herdr tab like `run-tab`, but always ask for extra arguments first"
command = "herdr-run --job --ask \"npm run '{split:\\t:0}'\""
mode = "execute"
